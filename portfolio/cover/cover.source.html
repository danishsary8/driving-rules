<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Source of cover/card.webp and cover/banner.webp. Open with ?mode=card (1600x1000) or ?mode=banner (1920x800) and screenshot at 2x. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500&family=Noto+Sans+Khmer:wght@600&display=swap" />
<style>
  :root {
    /* The portfolio's own "driving" cover stage (ProjectCover.tsx), so the grid stays one system. */
    --deep: #3d110b; --mid: #7d2418; --lit: #c2412d; --dot: #ffd166;
    /* The app's priority-question red, from the exam rules dialog. */
    --priority: #c75448;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: var(--w); height: var(--h); background: var(--deep); }
  body { font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .stage {
    position: relative; width: var(--w); height: var(--h); overflow: hidden;
    background: radial-gradient(120% 90% at 15% 10%, var(--lit) 0%, var(--mid) 50%, var(--deep) 100%);
  }
  .grain { position: absolute; inset: 0; background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 1px, transparent 1px 6px); }
  .light { position: absolute; right: -25%; top: -33%; width: 70%; height: 90%; border-radius: 50%; background: rgba(255,255,255,.10); filter: blur(64px); }

  .label { position: absolute; left: 6%; top: 9%; width: 46%; color: #fff; }
  .kind { display: flex; align-items: center; gap: 10px; font: 500 15px/1 'Geist Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.75); }
  .kind i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  h1 { margin-top: 18px; font-weight: 600; font-size: 92px; line-height: .95; letter-spacing: -0.04em; }
  .line { margin-top: 20px; font-size: 25px; line-height: 1.35; color: rgba(255,255,255,.75); }

  /* Signature: the five priority questions from the app's exam rules, where one mistake fails the exam. */
  .rule { position: absolute; left: 6%; top: 46%; }
  .pills { display: flex; gap: 9px; }
  .pills b { display: grid; place-items: center; width: 50px; height: 44px; border-radius: 10px; background: #fff; color: var(--priority); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; box-shadow: 0 10px 24px -10px rgba(0,0,0,.5); }
  .rule p { margin-top: 14px; font-size: 16.5px; color: rgba(255,255,255,.72); }
  .rule p em { font-style: normal; color: var(--dot); font-weight: 600; }

  .chips { position: absolute; left: 6%; bottom: 8%; display: flex; gap: 10px; }
  .chip { border-radius: 99px; padding: 8px 15px; font-size: 15px; font-weight: 500; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: rgba(255,255,255,.88); }
  .chip k { font-family: 'Noto Sans Khmer', sans-serif; font-weight: 600; }

  .phone { position: absolute; overflow: hidden; border-radius: 30px; border: 6px solid #1f0805; background: #1f0805; box-shadow: 0 44px 70px -24px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.08); }
  .phone img { display: block; width: 100%; border-radius: 24px; }

  /* Card (16:10): two phones bottom-right, like the other covers in the grid. */
  .card .p1 { right: 5%; bottom: -14%; width: 22%; }
  .card .p2 { right: 29%; bottom: -26%; width: 20%; }
  .card .p3 { display: none; }

  /* Banner (2.4:1): no title, the case study prints it above. Three phones. */
  .banner .label, .banner .chips, .banner .rule { display: none; }
  .banner .p2 { left: 41%; top: 9%; width: 18%; }
  .banner .p1 { left: 22%; top: 22%; width: 15.5%; }
  .banner .p3 { left: 62.5%; top: 22%; width: 15.5%; }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="grain"></div>
    <div class="light"></div>

    <div class="label">
      <p class="kind"><i></i>Driving theory app</p>
      <h1>Driving Rules</h1>
      <p class="line">Pass the driving theory exam</p>
    </div>

    <div class="rule" aria-hidden="true">
      <div class="pills"><b>26</b><b>27</b><b>28</b><b>29</b><b>30</b></div>
      <p>Priority questions · <em>one mistake fails the exam</em></p>
    </div>

    <div class="chips">
      <span class="chip">Works offline</span>
      <span class="chip">English · <k>ខ្មែរ</k></span>
    </div>

    <div class="phone p1"><img data-card="../screens/m-home.webp" data-banner="../screens/m-exam.webp" alt="" /></div>
    <div class="phone p2"><img data-card="../screens/m-result.webp" data-banner="../screens/m-result.webp" alt="" /></div>
    <div class="phone p3"><img data-card="" data-banner="../screens/m-flashcards.webp" alt="" /></div>
  </div>
  <script>
    const mode = new URLSearchParams(location.search).get('mode') || 'card';
    const [w, h] = mode === 'banner' ? [1920, 800] : [1600, 1000];
    document.documentElement.style.setProperty('--w', w + 'px');
    document.documentElement.style.setProperty('--h', h + 'px');
    document.getElementById('stage').classList.add(mode);
    document.querySelectorAll('img[data-card]').forEach((img) => {
      const src = img.dataset[mode];
      if (src) img.src = src;
    });
  </script>
</body>
</html>
